<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Exit Galaxy · soundtrack</title><style>body{font:16px system-ui;background:#041424;color:#e1eaf4;margin:0;padding:24px}main{max-width:460px;margin:40px auto}h1{color:#66caff;font-size:24px}input,button{display:block;margin:20px 0;max-width:100%}button{background:#075890;color:white;border:1px solid #66caff;padding:12px 18px;border-radius:4px;font:inherit}button:disabled{opacity:.5}a{color:#66caff}p{line-height:1.6}</style><main><h1>Exit Galaxy · soundtrack</h1><p>Одноразовая загрузка фонового MP3 (до 4,1 МБ). После загрузки музыка появится в сцене для всех посетителей.</p><input type="file" id="file" accept=".mp3,audio/mpeg"><button id="send" disabled>Загрузить трек</button><p id="status" role="status"></p><a href="/#exit-galaxy">Открыть Exit Galaxy</a></main><script>
const key=location.hash.slice(1);const f=document.getElementById('file'),b=document.getElementById('send'),s=document.getElementById('status');
if(!key)s.textContent='Нужна личная ссылка для загрузки.';
f.onchange=()=>{b.disabled=!key||!f.files.length;};
b.onclick=async()=>{const file=f.files[0];if(!file||!key)return;if(file.size>4100000){s.textContent='Выбери подготовленный MP3 до 4,1 МБ.';return;}b.disabled=true;s.textContent='Загрузка…';try{const r=await fetch('/api/exit-track',{method:'POST',headers:{'Content-Type':'audio/mpeg','X-Upload-Key':key},body:file});const d=await r.json();if(!r.ok&&r.status!==409)throw Error();s.textContent=r.status===409?'Трек уже загружен.':'Готово! Трек теперь доступен всем посетителям.';history.replaceState(null,'',location.pathname);}catch{s.textContent='Не удалось загрузить. Попробуй ещё раз.';b.disabled=false;}};
</script></html>
